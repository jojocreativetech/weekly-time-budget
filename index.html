}

}

  return t.toISOString().slice(0, 10);
}

}

  const t = s.trim().toLowerCase().replace(/\s+/g, "");

  if (m) return parseInt(m[1], 10) * 60 + (m[2] ? parseInt(m[2], 10) : 0);

}
function genId(p) {

}
function normPlaced(raw) {
  const p = raw && typeof raw === "object" ? raw : {};

    uid: String(p.uid ?? genId("p")),

    day: typeof p.day === "number" && p.day >= -1 && p.day <= 6 ? p.day : -1,

}

    return raw.filter(t => t && typeof t === "object" && typeof t.text === "string" && t.text.trim()).map(t => ({

      text: t.text.trim()

}

    placed,
    items: normItems(raw && raw.items !== undefined ? raw.items : raw && raw.notes),
    video: raw && typeof raw.video === "string" ? raw.video : "auto",

}
function normPalette(arr) {

    const o = b && typeof b === "object" ? b : {};

    const out = {
      id: String(o.id ?? genId("b")),
      label: String(o.label ?? "Block"),
      zone: ZONE_ORDER.includes(zoneRaw) ? zoneRaw : "noon",
      mins: typeof o.mins === "number" && o.mins > 0 ? Math.min(720, o.mins) : 60

}
// Average hours of sleep per night: 4 to 10, in half-hour steps. Default 7.
function normSleep(v) {

}
// Owner name shown in the header ("X's Weekly Time Budget"). Default "Jojo".
function normName(v) {

}
// Possessive that stays correct for names ending in s: Chris -> Chris', Jojo -> Jojo's.
function poss(n) {
